---
name: Main Branch CI

on:
    workflow_call:
        inputs:
            python-version:
                description: "Python version to use"
                required: false
                type: string
                default: "3.12"
            artifacts-dir:
                description: "Directory for storing all artifacts"
                required: false
                type: string
                default: "artifacts"

permissions:
    packages: write
    contents: read
    actions: read
    security-events: write

env:
    PYTHON_VERSION: ${{ inputs.python-version }}
    ARTIFACTS_DIR: ${{ inputs.artifacts-dir }}

jobs:
    setup:
        name: Setup Environment
        uses: ./.github/workflows/setup-environment.yml
        with:
            python-version: ${{ inputs.python-version }}
            artifacts-dir: ${{ inputs.artifacts-dir }}

    # Comprehensive checks for main branch
    pre_commit_all:
        name: Run All Pre-commit Hooks
        needs: setup
        uses: ./.github/workflows/pre-commit-all.yml
        with:
            python-version: ${{ inputs.python-version }}
            artifacts-dir: ${{ inputs.artifacts-dir }}

    tests:
        name: Run Tests with Coverage
        needs: setup
        uses: ./.github/workflows/tests.yml
        with:
            python-version: ${{ inputs.python-version }}
            artifacts-dir: ${{ inputs.artifacts-dir }}
            skip-coverage: false # Full coverage for main

    security_scan:
        name: Security Scan
        needs: setup
        uses: ./.github/workflows/security-scan.yml

    docker:
        name: Build and Push Docker Image
        needs: [pre_commit_all, tests, security_scan]
        uses: ./.github/workflows/docker.yml
        with:
            build-type: "main"
            branch-name: "main"
